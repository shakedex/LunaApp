# Development defaults for `cargo run` / `cargo test`. Any of these can be
# overridden from the environment (force = false). Windows paths; the Mac sets
# its own in the environment.
[env]
# Blackmagic RAW SDK: headers for the braw crate's shim, and the development
# fallback for the SDK libraries at run time.
BRAW_SDK_DIR = { value = 'C:\Program Files (x86)\Blackmagic Design\Blackmagic RAW\Blackmagic RAW SDK', force = false }
# The R3D add-on, built in the sibling decoders/r3d-sdk checkout
# (`cargo xtask package` builds it), and RED's library beside it.
LUNA_R3D_ADDON = { value = '../decoders/r3d-sdk/target/release/r3d.dll', relative = true, force = false }
LUNA_R3D_SDK_DIR = { value = '../decoders/r3d-sdk/reference/Redistributable/win', relative = true, force = false }
# FFmpeg's LGPL shared build (ProRes RAW on Windows); `cargo xtask package`
# bundles the same DLLs.
LUNA_FFMPEG_DIR = { value = '../decoders/tools/ffmpeg-8.1-lgpl-shared/ffmpeg-n8.1-latest-win64-lgpl-shared-8.1/bin', relative = true, force = false }
# The camera corpus the corpus tests read; they skip when it isn't there.
LUNA_CORPUS = { value = 'D:\LUNA_TEST\TEST_PROJECT_LUNA\CAMERA', force = false }
# The oldest macOS Luna supports (Apple Silicon). rustc and every cc-built shim
# (here and in the decoders the xtask builds) target it; Info.plist says the same.
MACOSX_DEPLOYMENT_TARGET = { value = '26.0', force = false }

# The decoders live in a private GitHub repo: fetch it with git's own
# credentials (`gh auth setup-git`).
[net]
git-fetch-with-cli = true

# `cargo xtask` runs Luna's build tasks (xtask/src/main.rs); `cargo xtask` lists them.
[alias]
xtask = "run --quiet --package xtask --"
