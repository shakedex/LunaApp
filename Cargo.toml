[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2026.10.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Private decoders, all in the private shakedex/luna-decoders repo, pinned to
# the commit Luna was verified against. Cargo finds each crate by name.
xocn = { git = "https://github.com/shakedex/luna-decoders", rev = "68ef86922ce50f710b872d645b79bee171efc59a" }
crm = { git = "https://github.com/shakedex/luna-decoders", rev = "68ef86922ce50f710b872d645b79bee171efc59a" }
# `arricore` ships a JPEG XS decoder (patent-pooled codec) and `hde` the Codex
# HDE decoder (SMPTE RDD 51, patent position unstated): drop a feature to turn
# those thumbnails off.
arri = { git = "https://github.com/shakedex/luna-decoders", rev = "68ef86922ce50f710b872d645b79bee171efc59a", features = ["arricore", "hde"] }
braw = { git = "https://github.com/shakedex/luna-decoders", rev = "68ef86922ce50f710b872d645b79bee171efc59a" }
# FFmpeg's LGPL prores_raw decoder, loaded at run time from bundled DLLs (Windows).
proresraw-ffmpeg = { git = "https://github.com/shakedex/luna-decoders", rev = "68ef86922ce50f710b872d645b79bee171efc59a" }
# The look Sony (VENICE 2, BURANO) and ARRI (ALEXA 35, Mini LF) cameras embed in MXF.
sony-look = { git = "https://github.com/shakedex/luna-decoders", rev = "68ef86922ce50f710b872d645b79bee171efc59a" }
arri-look = { git = "https://github.com/shakedex/luna-decoders", rev = "68ef86922ce50f710b872d645b79bee171efc59a" }

# Dependencies build without debug info: most of what link.exe writes and reads
# for each test binary. Luna's own crates keep it.
[profile.dev.package."*"]
debug = false
