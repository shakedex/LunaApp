[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2026.10.2"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Private decoders, all in the private shakedex/luna-decoders repo, pinned to
# the commit Luna was verified against. Cargo finds each crate by name.
xocn = { git = "https://github.com/shakedex/luna-decoders", rev = "630dd1079e48d07569615ceb23afb1f509db8e3b" }
crm = { git = "https://github.com/shakedex/luna-decoders", rev = "630dd1079e48d07569615ceb23afb1f509db8e3b" }
# `arricore` ships a JPEG XS decoder (patent-pooled codec) and `hde` the Codex
# HDE decoder (SMPTE RDD 51, patent position unstated): drop a feature to turn
# those thumbnails off.
arri = { git = "https://github.com/shakedex/luna-decoders", rev = "630dd1079e48d07569615ceb23afb1f509db8e3b", features = ["arricore", "hde"] }
braw = { git = "https://github.com/shakedex/luna-decoders", rev = "630dd1079e48d07569615ceb23afb1f509db8e3b" }
# FFmpeg's LGPL prores_raw decoder, loaded at run time from bundled DLLs (Windows).
proresraw-ffmpeg = { git = "https://github.com/shakedex/luna-decoders", rev = "630dd1079e48d07569615ceb23afb1f509db8e3b" }
