[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "2026.10.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Private decoders, all in the private shakedex/luna-decoders repo, pinned to
# the commit Luna was verified against. Cargo finds each crate by name.
xocn = { git = "https://github.com/shakedex/luna-decoders", rev = "6d7f66529b9c8756fde1e905a998819e834ba6bd" }
crm = { git = "https://github.com/shakedex/luna-decoders", rev = "6d7f66529b9c8756fde1e905a998819e834ba6bd" }
# `arricore` ships a JPEG XS decoder (patent-pooled codec): drop the feature to
# turn ARRICORE thumbnails off.
arri = { git = "https://github.com/shakedex/luna-decoders", rev = "6d7f66529b9c8756fde1e905a998819e834ba6bd", features = ["arricore"] }
braw = { git = "https://github.com/shakedex/luna-decoders", rev = "6d7f66529b9c8756fde1e905a998819e834ba6bd" }
# FFmpeg's LGPL prores_raw decoder, loaded at run time from bundled DLLs (Windows).
proresraw-ffmpeg = { git = "https://github.com/shakedex/luna-decoders", rev = "6d7f66529b9c8756fde1e905a998819e834ba6bd" }
