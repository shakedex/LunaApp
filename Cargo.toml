[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# Private decoders (not published), pinned to the commits Luna was verified against.
xocn = { git = "file:///E:/Coding/decoders/xocn-decoder", rev = "2b183188fbc5a97544e6844333ab3bc07744e169" }
crm = { git = "file:///E:/Coding/decoders/crm-decoder", rev = "d4725b19b4af7bde2f1699b19bfa163ed4fbc89f" }
# `arricore` ships a JPEG XS decoder (patent-pooled codec): drop the feature to
# turn ARRICORE thumbnails off.
arri = { git = "file:///E:/Coding/decoders/arri-decoder", rev = "5ad6add7dcaa9bc9af52ee41d0eee9f9e83973e2", features = ["arricore"] }
braw = { git = "file:///E:/Coding/decoders/braw-sdk", rev = "1fd58351bdc92dda7a239265172d81465ff35e19" }
# FFmpeg's LGPL prores_raw decoder, loaded at run time from bundled DLLs (Windows).
proresraw-ffmpeg = { git = "file:///E:/Coding/decoders/proresraw-ffmpeg", rev = "1cb54c4218e113d51f7e16e4e94f6784ddf6ff96" }
