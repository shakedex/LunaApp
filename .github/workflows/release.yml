# Luna Release - Build and Publish Installers
# Manually triggered workflow to create versioned releases with Velopack installers

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version override (leave blank to use <Version> from LunaApp.csproj)'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Resolves the version that all downstream jobs use. Either takes the
  # workflow input (if non-empty) or falls back to <Version> in the csproj.
  # Keeps versioning centralized in one place — bumping requires editing
  # exactly one line in LunaApp.csproj.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: set
        run: |
          input='${{ inputs.version }}'
          if [ -n "$input" ]; then
            v="$input"
            echo "Using workflow input override: $v"
          else
            # Require <Version>...</Version> on the same line so the regex
            # ignores stray <Version> mentions inside multi-line XML comments.
            v=$(grep -oP '<Version>\K[^<]+(?=</Version>)' LunaApp.csproj | head -1)
            echo "Using <Version> from LunaApp.csproj: $v"
          fi
          if [ -z "$v" ]; then
            echo "::error::Could not resolve a version (input empty and <Version> not found in csproj)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: resolve-version
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Restore dependencies
        run: dotnet restore LunaApp.csproj -r win-x64

      - name: Publish application (self-contained + trimmed)
        run: |
          dotnet publish LunaApp.csproj -c Release -r win-x64 --self-contained true -o ./publish/win-x64 `
            /p:Version=${{ needs.resolve-version.outputs.version }} `
            /p:PublishTrimmed=true `
            /p:TrimMode=partial `
            /p:PublishSingleFile=false

      - name: Verify runtime is bundled
        run: |
          if (Test-Path "./publish/win-x64/System.Private.CoreLib.dll") {
            Write-Host "✓ .NET runtime bundled successfully" -ForegroundColor Green
          } else {
            Write-Error "✗ Runtime NOT bundled - self-contained build failed!"
            exit 1
          }

      - name: Verify bundled assemblies + native deps
        shell: pwsh
        # Note: the native MediaInfo binary ships as `libmediainfo.dll` (NuGet
        # payload path: runtimes/win-x64/native/), NOT `MediaInfo.dll`.
        run: |
          $publishPath = "./publish/win-x64"
          $required = @(
            "Luna.exe", "Avalonia.dll", "SkiaSharp.dll",
            "FFmpeg.AutoGen.dll", "MediaInfo.Wrapper.Core.dll",
            "QuestPDF.dll", "Velopack.dll",
            "libSkiaSharp.dll", "libmediainfo.dll"
          )
          foreach ($name in $required) {
            $p = Join-Path $publishPath $name
            if (-not (Test-Path $p)) {
              Write-Error "Required file missing from publish output: $name"
              exit 1
            }
          }
          $ffmpegDlls = @("avcodec-61.dll", "avformat-61.dll", "avutil-59.dll", "swresample-5.dll", "swscale-8.dll")
          foreach ($name in $ffmpegDlls) {
            $p = Join-Path $publishPath "tools/ffmpeg/win-x64" | Join-Path -ChildPath $name
            if (-not (Test-Path $p)) {
              Write-Error "FFmpeg DLL missing from publish output: $name"
              exit 1
            }
          }
          if (Test-Path (Join-Path $publishPath "Avalonia.Diagnostics.dll")) {
            Write-Error "Avalonia.Diagnostics.dll leaked into Release publish output"
            exit 1
          }
          Write-Host "Bundled assemblies + native deps verified"

      - name: Create Velopack installer (Setup.exe, branded)
        run: |
          vpk pack `
            --packId "Luna" `
            --packVersion ${{ needs.resolve-version.outputs.version }} `
            --packDir ./publish/win-x64 `
            --mainExe Luna.exe `
            --outputDir ./releases/win-x64 `
            --packAuthors "Luna" `
            --packTitle "Luna - Camera Report Generator" `
            --icon Assets/luna-logo.ico `
            --splashImage Assets/install-splash.png

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-win-x64-installer
          path: ./releases/win-x64/*
          retention-days: 30

  build-macos-arm:
    needs: resolve-version
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Restore dependencies
        run: dotnet restore LunaApp.csproj -r osx-arm64

      - name: Publish application (self-contained + trimmed)
        run: |
          dotnet publish LunaApp.csproj -c Release -r osx-arm64 --self-contained true -o ./publish/osx-arm64 \
            /p:Version=${{ needs.resolve-version.outputs.version }} \
            /p:PublishTrimmed=true \
            /p:TrimMode=partial \
            /p:PublishSingleFile=false

      - name: Verify runtime is bundled
        run: |
          if [ -f "./publish/osx-arm64/System.Private.CoreLib.dll" ]; then
            echo "✓ .NET runtime bundled successfully"
          else
            echo "✗ Runtime NOT bundled - self-contained build failed!"
            exit 1
          fi

      # FFmpeg dylibs are NOT committed to the repo for macOS (unlike Windows).
      # We pull them from Homebrew at build time, then use dylibbundler to
      # rewrite each dylib's install_name + LC_LOAD_DYLIB entries from absolute
      # /opt/homebrew/... paths to @loader_path/, and copy every transitive
      # dependency into the same directory. The result is a self-contained
      # tools/ffmpeg/osx-arm64/ folder that loads correctly from inside the
      # .app bundle on machines without Homebrew.
      #
      # Luna is GPLv3, which is compatible with Homebrew's ffmpeg formula
      # (built with --enable-gpl + GPL-licensed deps such as x264/x265).
      - name: Install Homebrew FFmpeg + dylibbundler
        run: |
          brew update
          brew install ffmpeg dylibbundler

      - name: Bundle FFmpeg dylibs into publish output
        run: |
          set -euo pipefail
          PREFIX=$(brew --prefix)
          DEST="./publish/osx-arm64/tools/ffmpeg/osx-arm64"
          mkdir -p "$DEST"

          # Core libs Luna's FFmpeg.AutoGen bindings load. Versions match
          # FFmpeg 7.x ABI (avcodec 61, avformat 61, avutil 59, swscale 8,
          # swresample 5).
          LIBS=(libavcodec.61 libavformat.61 libavutil.59 libswscale.8 libswresample.5)
          for lib in "${LIBS[@]}"; do
            src="$PREFIX/lib/$lib.dylib"
            if [ ! -f "$src" ]; then
              echo "::error::Expected FFmpeg dylib not found at $src"
              exit 1
            fi
            cp -L "$src" "$DEST/"
            chmod u+w "$DEST/$lib.dylib"
          done

          # dylibbundler walks each -x dylib's deps, copies them into -d, and
          # rewrites every install_name + reference to @loader_path/<basename>.
          # -of: overwrite already-present files (the 5 we just staged).
          # -b:  ignore missing inputs gracefully (none expected).
          XFLAGS=()
          for lib in "${LIBS[@]}"; do
            XFLAGS+=(-x "$DEST/$lib.dylib")
          done
          dylibbundler -of -b -d "$DEST/" -p '@loader_path/' "${XFLAGS[@]}"

          echo "Bundled FFmpeg payload:"
          ls -la "$DEST"

      - name: Verify FFmpeg dylibs + runtime payload
        run: |
          set -euo pipefail
          PUB="./publish/osx-arm64"
          REQUIRED=(
            "Luna" "Avalonia.dll" "SkiaSharp.dll"
            "FFmpeg.AutoGen.dll" "MediaInfo.Wrapper.Core.dll"
            "QuestPDF.dll" "Velopack.dll"
            "libSkiaSharp.dylib"
          )
          for f in "${REQUIRED[@]}"; do
            if [ ! -f "$PUB/$f" ]; then
              echo "::error::Required file missing from publish output: $f"
              exit 1
            fi
          done

          FFMPEG_DIR="$PUB/tools/ffmpeg/osx-arm64"
          REQUIRED_DYLIBS=(
            "libavcodec.61.dylib" "libavformat.61.dylib" "libavutil.59.dylib"
            "libswscale.8.dylib" "libswresample.5.dylib"
          )
          for f in "${REQUIRED_DYLIBS[@]}"; do
            if [ ! -f "$FFMPEG_DIR/$f" ]; then
              echo "::error::FFmpeg dylib missing: $f"
              exit 1
            fi
          done

          # Catch the silent failure mode where dylibbundler skipped rewriting
          # and left absolute /opt/homebrew/ refs that would break on user
          # machines. Anything still pointing outside @loader_path/ is fatal.
          echo "Auditing install_name references..."
          BAD=0
          for dylib in "$FFMPEG_DIR"/*.dylib; do
            while IFS= read -r ref; do
              case "$ref" in
                @loader_path/*|@executable_path/*|@rpath/*|/usr/lib/*|/System/*) ;;
                *)
                  echo "::error::$dylib still references $ref"
                  BAD=1
                  ;;
              esac
            done < <(otool -L "$dylib" | tail -n +2 | awk '{print $1}')
          done
          if [ "$BAD" -ne 0 ]; then
            exit 1
          fi

          if [ -f "$PUB/Avalonia.Diagnostics.dll" ]; then
            echo "::error::Avalonia.Diagnostics.dll leaked into Release publish output"
            exit 1
          fi
          echo "✓ macOS publish payload verified"

      - name: Set executable permissions on published app
        run: |
          chmod +x ./publish/osx-arm64/Luna
          chmod +x ./publish/osx-arm64/tools/ffmpeg/osx-arm64/*.dylib || true

      - name: Create Velopack installer (.pkg, branded icon)
        # Velopack on macOS produces a .pkg installer (productbuild) plus a
        # portable .zip — there is no DMG output. --channel osx-arm64 keeps
        # the artifact name arch-specific so an Intel build later won't collide.
        run: |
          vpk pack \
            --packId "Luna" \
            --packVersion ${{ needs.resolve-version.outputs.version }} \
            --packDir ./publish/osx-arm64 \
            --mainExe Luna \
            --channel osx-arm64 \
            --outputDir ./releases/osx-arm64 \
            --packAuthors "Luna" \
            --packTitle "Luna - Camera Report Generator" \
            --icon Assets/luna-logo.icns

      - name: Upload macOS installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-osx-arm64-installer
          path: ./releases/osx-arm64/*
          retention-days: 30

  create-release:
    needs: [resolve-version, build-windows, build-macos-arm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: luna-win-x64-installer
          path: ./artifacts/win-x64

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: luna-osx-arm64-installer
          path: ./artifacts/osx-arm64

      - name: List artifacts
        run: |
          echo "=== Windows Artifacts ==="
          ls -la ./artifacts/win-x64/
          echo ""
          echo "=== macOS Artifacts ==="
          ls -la ./artifacts/osx-arm64/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.resolve-version.outputs.version }}
          name: Luna v${{ needs.resolve-version.outputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            ./artifacts/win-x64/*
            ./artifacts/osx-arm64/*
          body: |
            ## Installation

            ### Windows
            1. Download `Luna-${{ needs.resolve-version.outputs.version }}-win-Setup.exe`
            2. Run the installer - if SmartScreen appears, click "More info" → "Run anyway"
            3. Luna installs to your user profile (no admin required) and launches automatically

            ### macOS (Apple Silicon)
            1. Download `Luna-osx-arm64-Setup.pkg`
            2. Double-click the .pkg and follow the installer — Luna lands in `/Applications`
            3. First launch: Right-click Luna → Open → Click "Open" in the dialog (Gatekeeper bypass for unsigned builds)
            4. **Important:** Run this command in Terminal to clear quarantine on bundled tools:
               ```
               xattr -cr /Applications/Luna.app
               ```

            See [Installation Guide](https://github.com/shakedex/LunaApp/blob/master/docs/INSTALLATION.md) for detailed instructions.

            ---
            *Built with .NET 10 runtime included - no additional installation required.*
