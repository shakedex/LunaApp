<!doctype html>
<!-- The repo's social preview (1280 x 640) and the site's sharing card
     (1200 x 630), from one layout. render.sh screenshots it at both sizes. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Plex";
        src: url("../../../Assets/fonts/IBMPlexSans-Regular.ttf");
        font-weight: 400;
      }
      @font-face {
        font-family: "Plex";
        src: url("../../../Assets/fonts/IBMPlexSans-Medium.ttf");
        font-weight: 500;
      }
      @font-face {
        font-family: "Plex";
        src: url("../../../Assets/fonts/IBMPlexSans-SemiBold.ttf");
        font-weight: 600;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: "Plex", sans-serif;
        color: #e4e8ef;
        background:
          radial-gradient(60vw 70vh at 78% 55%, rgb(121 202 234 / 0.1), transparent 70%),
          #0c0f14;
      }

      .copy {
        position: absolute;
        left: 6.9vw;
        top: 50%;
        transform: translateY(-50%);
        width: 40vw;
      }
      .logo {
        width: 7.5vw;
        display: block;
        margin-bottom: 2.6vh;
      }
      h1 {
        font-size: 9.4vw;
        line-height: 0.95;
        letter-spacing: -0.045em;
        font-weight: 600;
      }
      p {
        margin-top: 3.4vh;
        font-size: 2.65vw;
        line-height: 1.2;
        letter-spacing: -0.02em;
        font-weight: 500;
        color: #99a2b2;
        max-width: 15em;
      }
      /* The two platforms, as the site's download buttons would show them. */
      .platforms {
        display: flex;
        gap: 0.8vw;
        margin-top: 4.6vh;
      }
      .platforms span {
        display: inline-flex;
        align-items: center;
        gap: 0.6vw;
        padding: 0.75vw 1.2vw;
        border-radius: 0.5vw;
        background: #181d25;
        border: 1px solid #2b3341;
        font-size: 1.45vw;
        font-weight: 500;
        color: #e4e8ef;
      }
      .platforms svg {
        width: 1.5vw;
        height: 1.5vw;
        fill: #79caea;
      }

      /* The report's first page, behind the window. */
      .page {
        position: absolute;
        left: 47vw;
        top: 7vh;
        width: 42vw;
        border-radius: 0.3vw;
        transform: rotate(-5deg);
        box-shadow:
          0 0 0 1px rgb(255 255 255 / 0.1),
          0 3vw 7vw -1vw rgb(0 0 0 / 0.8);
        opacity: 0.92;
      }
      /* The app's window, done, running off the right edge. */
      .window {
        position: absolute;
        left: 53vw;
        top: 21vh;
        width: 53vw;
        border-radius: 0.8vw;
        box-shadow:
          0 0 0 1px rgb(255 255 255 / 0.08),
          0 4vw 9vw -2vw rgb(0 0 0 / 0.85);
      }
    </style>
  </head>
  <body>
    <img class="page" src="../../public/img/report/light-p1.webp" alt="" />
    <img class="window" src="../../public/img/app-done@2x.webp" alt="" />
    <div class="copy">
      <img class="logo" src="../../../Assets/luna-logo-lg.webp" alt="" />
      <h1>Luna</h1>
      <p>Beautiful reports for every camera. Free.</p>
      <div class="platforms">

        <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="currentColor"><path d="M128.23,30A40,40,0,0,1,167,0h1a8,8,0,0,1,0,16h-1a24,24,0,0,0-23.24,18,8,8,0,1,1-15.5-4ZM223.3,169.59a8.07,8.07,0,0,0-2.8-3.4C203.53,154.53,200,134.64,200,120c0-17.67,13.47-33.06,21.5-40.67a8,8,0,0,0,0-11.62C208.82,55.74,187.82,48,168,48a72.23,72.23,0,0,0-40,12.13,71.56,71.56,0,0,0-90.71,9.09A74.63,74.63,0,0,0,16,123.4a127,127,0,0,0,40.14,89.73A39.8,39.8,0,0,0,83.59,224h87.68a39.84,39.84,0,0,0,29.12-12.57,125,125,0,0,0,17.82-24.6C225.23,174,224.33,172,223.3,169.59Z"/></svg> macOS</span>
      </div>
    </div>
  </body>
</html>
