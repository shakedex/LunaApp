[package]
name = "luna-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = "4.6.7"
ctrlc = "3.5.2"
luna-core = { path = "../luna-core" }
luna-log = { path = "../luna-log" }
luna-worker = { path = "../luna-worker" }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3.27.0"
