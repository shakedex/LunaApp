[package]
name = "luna-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
clap = "4.6.7"
luna-core = { path = "../luna-core" }
luna-log = { path = "../luna-log" }
luna-update = { path = "../luna-update" }
luna-worker = { path = "../luna-worker" }
open = "5.4.4"
rfd = "0.17.2"
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
tracing = "0.1.44"

[build-dependencies]
slint-build = "1.18.1"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
i-slint-backend-winit = "=1.18.1"
muda = { version = "0.19.3", default-features = false }
